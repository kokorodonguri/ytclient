<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="
        default-src 'self';
        img-src 'self' https: data: blob:;
        style-src 'self' 'unsafe-inline';
        script-src 'self';
        connect-src 'self' http: https: ws: wss:;
        frame-src https://www.youtube.com https://*.youtube.com https://www.youtube-nocookie.com https://*.youtube-nocookie.com;
        media-src 'self' blob:;
        object-src 'none';
        base-uri 'none';
        form-action 'none';
      "
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="ぶいすぽっ！メンバーのYouTube配信をまとめてチェックできる非公式クライアントアプリです。"
        />
        <meta name="theme-color" content="#ec4899" />
        <title>ぶいすぽっ！クライアント</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <a class="skip-link" href="#main-content">メインコンテンツへスキップ</a>

        <div
            id="sidebar-overlay"
            class="sidebar-overlay"
            aria-hidden="true"
        ></div>

        <aside id="sidebar" class="sidebar" aria-label="サイドメニュー" inert>
            <div class="sidebar-top">
                <div class="sidebar-top-content">
                    <h2 class="sidebar-title">ぶいすぽっ！クライアント</h2>
                </div>
                <div class="sidebar-current-channel-area">
                    <div class="sidebar-current-channel">
                        <span id="sidebar-selected-channel">すべての推し</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-middle" aria-label="主要メニュー">
                <button
                    class="menu-item active"
                    id="sidebar-home-btn"
                    type="button"
                    aria-current="page"
                >
                    <span class="icon" aria-hidden="true">🏠</span>
                    <span>ホーム (すべて表示)</span>
                </button>

                <h2 class="menu-section-title">登録チャンネル</h2>
                <div id="sidebar-channel-list">
                    <!-- チャンネルリストはJavaScriptによって動的に追加されます -->
                </div>
            </nav>
        </aside>

        <header id="main-header" aria-labelledby="app-title">
            <div class="header-left">
                <button
                    id="hamburger-btn"
                    class="hamburger-btn"
                    type="button"
                    aria-label="サイドメニューを開閉"
                    aria-expanded="false"
                    aria-controls="sidebar"
                >
                    <svg
                        viewBox="0 0 24 24"
                        width="28"
                        height="28"
                        fill="currentColor"
                        aria-hidden="true"
                    >
                        <path
                            d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"
                        />
                    </svg>
                </button>

                <div class="app-heading">
                    <h1 id="app-title">ぶいすぽっ！クライアント</h1>
                </div>
            </div>

            <nav class="tabs" role="tablist" aria-label="動画モード切り替え">
                <button
                    id="tab-official"
                    class="tab-btn active"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    aria-controls="official-container"
                >
                    <span aria-hidden="true">📺</span> メンバー配信
                </button>
                <button
                    id="tab-clips"
                    class="tab-btn"
                    type="button"
                    role="tab"
                    aria-selected="false"
                    aria-controls="clips-container"
                >
                    <span aria-hidden="true">✂️</span> 切り抜き
                </button>
            </nav>

            <div class="controls">
                <div class="custom-dropdown" id="game-dropdown">
                    <button
                        class="dropdown-selected"
                        id="game-selected-text"
                        type="button"
                        aria-haspopup="listbox"
                        aria-expanded="false"
                        aria-label="ゲームフィルターを選択"
                    >
                        すべてのゲーム
                    </button>
                    <ul
                        class="dropdown-options"
                        id="game-options"
                        role="listbox"
                        tabindex="-1"
                        aria-labelledby="game-selected-text"
                    >
                        <li
                            class="dropdown-item"
                            id="game-opt-0"
                            role="option"
                            aria-selected="true"
                            data-value=""
                        >
                            すべてのゲーム
                        </li>
                        <li
                            class="dropdown-item"
                            id="game-opt-1"
                            role="option"
                            aria-selected="false"
                            data-value="Apex"
                        >
                            Apex Legends
                        </li>
                        <li
                            class="dropdown-item"
                            id="game-opt-2"
                            role="option"
                            aria-selected="false"
                            data-value="Valorant"
                        >
                            VALORANT
                        </li>
                        <li
                            class="dropdown-item"
                            id="game-opt-3"
                            role="option"
                            aria-selected="false"
                            data-value="スプラ"
                        >
                            Splatoon / スプラ
                        </li>
                        <li
                            class="dropdown-item"
                            id="game-opt-4"
                            role="option"
                            aria-selected="false"
                            data-value="Minecraft"
                        >
                            Minecraft / マイクラ
                        </li>
                        <li
                            class="dropdown-item"
                            id="game-opt-5"
                            role="option"
                            aria-selected="false"
                            data-value="歌枠"
                        >
                            歌枠 / 歌ってみた
                        </li>
                        <li
                            class="dropdown-item"
                            id="game-opt-6"
                            role="option"
                            aria-selected="false"
                            data-value="雑談"
                        >
                            雑談
                        </li>
                    </ul>
                </div>

                <input
                    type="search"
                    id="free-word"
                    class="free-word-input"
                    placeholder="追加ワード (例: コラボ)"
                    aria-label="追加検索ワード"
                />
                <button id="refresh-btn" type="button">
                    <span class="icon" aria-hidden="true">🔄</span>
                    <span>最新を読み込む</span>
                </button>
                <button
                    id="settings-btn"
                    class="icon-control-btn"
                    type="button"
                    aria-label="&#35373;&#23450;"
                    title="&#35373;&#23450;"
                >
                    <span aria-hidden="true">&#9881;</span>
                </button>

            </div>
        </header>

        <main id="main-content" tabindex="-1">
            <section id="feed-status-panel" class="feed-status-panel">
                <div class="feed-status-main">
                    <span id="connection-status" class="status-pill loading">
                        接続確認中
                    </span>
                    <span
                        id="feed-summary"
                        class="feed-summary"
                        aria-live="polite"
                        aria-atomic="true"
                    >
                        データを準備しています
                    </span>
                </div>
                <div id="active-filters" class="active-filters"></div>
                <button
                    id="clear-filters-btn"
                    class="clear-filters-btn hidden"
                    type="button"
                >
                    フィルター解除
                </button>
            </section>

            <section
                id="official-container"
                class="video-grid"
                role="tabpanel"
                tabindex="0"
                aria-labelledby="tab-official"
            >
                <!-- 初期ロード中のスケルトン -->
                <div class="skeleton-grid">
                    <article class="video-card-skeleton">
                        <div class="skeleton-thumbnail"></div>
                        <div class="skeleton-info">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-channel"></div>
                        </div>
                    </article>
                    <article class="video-card-skeleton">
                        <div class="skeleton-thumbnail"></div>
                        <div class="skeleton-info">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-channel"></div>
                        </div>
                    </article>
                    <article class="video-card-skeleton">
                        <div class="skeleton-thumbnail"></div>
                        <div class="skeleton-info">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-channel"></div>
                        </div>
                    </article>
                    <article class="video-card-skeleton">
                        <div class="skeleton-thumbnail"></div>
                        <div class="skeleton-info">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-channel"></div>
                        </div>
                    </article>
                </div>
            </section>

            <section
                id="clips-container"
                class="video-grid hidden"
                role="tabpanel"
                tabindex="0"
                aria-labelledby="tab-clips"
            >
                <!-- 初期ロード中のスケルトン -->
                <div class="skeleton-grid">
                    <article class="video-card-skeleton">
                        <div class="skeleton-thumbnail"></div>
                        <div class="skeleton-info">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-channel"></div>
                        </div>
                    </article>
                    <article class="video-card-skeleton">
                        <div class="skeleton-thumbnail"></div>
                        <div class="skeleton-info">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-channel"></div>
                        </div>
                    </article>
                    <article class="video-card-skeleton">
                        <div class="skeleton-thumbnail"></div>
                        <div class="skeleton-info">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-channel"></div>
                        </div>
                    </article>
                    <article class="video-card-skeleton">
                        <div class="skeleton-thumbnail"></div>
                        <div class="skeleton-info">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-channel"></div>
                        </div>
                    </article>
                </div>
            </section>

            <section
                id="player-view"
                class="hidden"
                role="region"
                aria-label="動画プレイヤー"
            >
                <button
                    id="back-btn"
                    class="back-button"
                    type="button"
                    aria-label="一覧に戻る"
                >
                    <span class="icon" aria-hidden="true">←</span>
                    <span>一覧に戻る</span>
                </button>
                <h2 id="player-video-title" class="player-title"></h2>

                <div id="player-container" class="player-container">
                    <!-- プレイヤーコンテンツはJavaScriptによって動的に挿入されます -->
                </div>

                <aside
                    id="description-container"
                    class="video-description-box hidden"
                    aria-label="動画概要欄"
                >
                    <h3 class="sr-only">動画概要</h3>
                    <div id="video-description" class="collapsed"></div>
                    <button
                        id="toggle-description-btn"
                        class="description-toggle-btn"
                        type="button"
                        aria-expanded="false"
                        aria-controls="video-description"
                    >
                        もっと見る
                    </button>
                </aside>

            </section>
        </main>

        <!-- トースト通知コンテナ -->
        <div
            class="toast-container"
            id="toast-container"
            role="status"
            aria-live="polite"
        ></div>

        <div
            id="settings-modal"
            class="settings-modal hidden"
            role="dialog"
            aria-modal="true"
            aria-labelledby="settings-title"
        >
            <div class="settings-panel">
                <div class="settings-header">
                    <h2 id="settings-title">&#35373;&#23450;</h2>
                    <button
                        id="settings-close-btn"
                        class="icon-control-btn"
                        type="button"
                        aria-label="&#35373;&#23450;&#12434;&#38281;&#12376;&#12427;"
                    >
                        &times;
                    </button>
                </div>
                <form id="settings-form" class="settings-form">
                    <label class="settings-field" for="backend-url-input">
                        <span>&#12496;&#12483;&#12463;&#12456;&#12531;&#12489;&#12469;&#12540;&#12496;&#12540;</span>
                        <input
                            id="backend-url-input"
                            type="text"
                            inputmode="url"
                            autocomplete="off"
                            placeholder="192.168.1.33"
                        />
                    </label>
                    <label class="settings-check">
                        <input id="start-local-backend-check" type="checkbox" />
                        <span>&#12371;&#12398;PC&#12391;&#12496;&#12483;&#12463;&#12456;&#12531;&#12489;&#12434;&#36215;&#21205;&#12377;&#12427;</span>
                    </label>
                    <p id="settings-current-backend" class="settings-current"></p>
                    <div class="settings-actions">
                        <button
                            id="settings-cancel-btn"
                            class="player-secondary-btn"
                            type="button"
                        >
                            &#12461;&#12515;&#12531;&#12475;&#12523;
                        </button>
                        <button
                            id="settings-save-btn"
                            class="player-fallback-open-btn"
                            type="submit"
                        >
                            &#20445;&#23384;&#12375;&#12390;&#25509;&#32154;
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- JavaScript modules -->
        <script type="module" src="renderer.js"></script>
    </body>
</html>
