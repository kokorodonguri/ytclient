name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチへの連続 push で古い実行を打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r requirements-dev.txt

      - name: Verify the backend package imports
        # deploy-backend.sh が本番で同じことをする。ここで落とせば
        # systemctl restart 後のクラッシュループで初めて気付く事態を避けられる。
        run: python -c "import main"
        working-directory: backend

      - name: ruff
        run: python -m ruff check backend tests

      - name: mypy
        run: python -m mypy

      - name: pytest
        run: python -m pytest

  frontend:
    name: frontend (syntax + channel parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        # electron のバイナリは CI では使わない（100MB 超のダウンロードを省く）
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: npm run check
        run: npm run check

      - name: eslint
        run: npm run lint:js
